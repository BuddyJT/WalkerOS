      <stop offset="1" stop-color="#010204"/>
    </linearGradient>
    <radialGradient id="shine" cx="38" cy="25" r="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2cf5ff" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#0a1622" stop-opacity="0.18"/>
