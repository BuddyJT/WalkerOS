<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Walker OS capability stack</title>
  <desc id="desc">A layered diagram showing device image, voice core, mobility, AR glasses, home devices, and developer modules.</desc>
  <rect width="720" height="520" rx="16" fill="#020509"/>
  <g fill="none" stroke="#21f3ff" stroke-width="2" opacity="0.28">
    <path d="M90 114h540M90 209h540M90 304h540M90 399h540"/>
    <path d="M170 72v376M360 72v376M550 72v376"/>
  </g>
  <circle cx="360" cy="260" r="174" fill="none" stroke="#ff9d23" stroke-width="3" opacity="0.26"/>
  <circle cx="360" cy="260" r="128" fill="none" stroke="#21f3ff" stroke-width="2" opacity="0.34"/>
  <path d="M104 72h512M104 476h512" stroke="#ff9d23" stroke-width="4" opacity="0.54"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="800">
    <rect x="104" y="72" width="512" height="72" rx="8" fill="#07111a" stroke="#21f3ff" stroke-width="2"/>
    <text x="360" y="116" text-anchor="middle" font-size="25" fill="#ffbf69">Walker OS image</text>
    <rect x="104" y="178" width="148" height="86" rx="8" fill="#07111a" stroke="#21f3ff" stroke-width="2"/>
    <rect x="286" y="178" width="148" height="86" rx="8" fill="#1a1007" stroke="#ff9d23" stroke-width="2"/>
    <rect x="468" y="178" width="148" height="86" rx="8" fill="#07111a" stroke="#21f3ff" stroke-width="2"/>
    <text x="178" y="215" text-anchor="middle" font-size="18" fill="#f0fbff">Voice</text>
    <text x="178" y="239" text-anchor="middle" font-size="13" fill="#8fb0bd">STT + TTS</text>
    <text x="360" y="215" text-anchor="middle" font-size="18" fill="#ffbf69">Mobility</text>
    <text x="360" y="239" text-anchor="middle" font-size="13" fill="#dca96d">Car context</text>
    <text x="542" y="215" text-anchor="middle" font-size="18" fill="#f0fbff">AR glasses</text>
    <text x="542" y="239" text-anchor="middle" font-size="13" fill="#8fb0bd">Caption layer</text>
    <rect x="104" y="304" width="240" height="82" rx="8" fill="#07111a" stroke="#57a8ff" stroke-width="2"/>
    <rect x="376" y="304" width="240" height="82" rx="8" fill="#07111a" stroke="#21f3ff" stroke-width="2"/>
    <text x="224" y="339" text-anchor="middle" font-size="18" fill="#f0fbff">Home + sensors</text>
    <text x="224" y="362" text-anchor="middle" font-size="13" fill="#8fb0bd">Local device routines</text>
    <text x="496" y="339" text-anchor="middle" font-size="18" fill="#f0fbff">Developer modules</text>
    <text x="496" y="362" text-anchor="middle" font-size="13" fill="#8fb0bd">Signed extensions</text>
    <rect x="174" y="430" width="372" height="46" rx="8" fill="#010204" stroke="#ff9d23" stroke-width="2"/>
    <text x="360" y="460" text-anchor="middle" font-size="17" fill="#21f3ff">Local-first privacy and safety controls</text>
  </g>
