<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Walker OS Node icon</title>
  <desc id="desc">A compact original Walker OS app icon with a secure node lattice and amber command point.</desc>
  <defs>
    <linearGradient id="bg" x1="15" y1="10" x2="113" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173c54"/>
      <stop offset="0.48" stop-color="#081522"/>
      <stop offset="1" stop-color="#010204"/>
    </linearGradient>
    <radialGradient id="shine" cx="38" cy="25" r="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2cf5ff" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#0a1622" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#010204" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="32" y1="29" x2="96" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24f4ff"/>
      <stop offset="0.55" stop-color="#eafbff"/>
      <stop offset="1" stop-color="#ff9d23"/>
    </linearGradient>
    <radialGradient id="field" cx="65" cy="64" r="45" gradientUnits="userSpaceOnUse">
