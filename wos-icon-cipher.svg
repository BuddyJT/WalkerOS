    </filter>
    <filter id="amberGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#ff9d23" flood-opacity="0.48"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="29" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="29" fill="url(#shine)"/>
  <circle cx="64" cy="64" r="44" fill="url(#field)"/>
  <path d="M64 25L97 45V83L64 103L31 83V45Z" fill="#050b11" stroke="url(#line)" stroke-width="5" stroke-linejoin="round" filter="url(#lift)"/>
  <path d="M64 25V103M31 45L97 83M97 45L31 83" stroke="url(#line)" stroke-width="3.6" stroke-linecap="round" opacity="0.68"/>
