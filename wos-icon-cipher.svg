  <circle cx="31" cy="83" r="5" fill="#24f4ff"/>
  <circle cx="97" cy="45" r="5" fill="#ffb24a" filter="url(#amberGlow)"/>
  <circle cx="97" cy="83" r="5" fill="#ffb24a" filter="url(#amberGlow)"/>
  <circle cx="64" cy="103" r="5" fill="#ffb24a" filter="url(#amberGlow)"/>
  <path d="M56 56H72V72H56Z" fill="#071018" stroke="#f8feff" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="5" fill="#ffb24a" filter="url(#amberGlow)"/>
  <rect x="15" y="15" width="98" height="98" rx="23" fill="none" stroke="#f8feff" stroke-opacity="0.08" stroke-width="2"/>
